name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stonks
          POSTGRES_PASSWORD: stonks
          POSTGRES_DB: stonks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stonks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Exercises the Postgres backend in tests/test_persistence.py.
      TEST_DATABASE_URL: postgresql://stonks:stonks@localhost:5432/stonks_test
      # Throwaway signing key for test tokens only - not a real secret.
      JWT_SECRET_KEY: ci-only-test-signing-key-not-a-secret-000000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q -p no:cacheprovider

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
