name: Keep backend warm

# Render's free instance sleeps after ~15 minutes idle and takes up to a
# minute to cold-start. Ping it every 10 minutes during Indian waking hours
# (~07:30-00:30 IST) so users rarely hit a cold start, while staying well
# inside the free tier's monthly instance hours. The app's "waking up"
# banner covers the remaining gaps (GitHub may delay scheduled runs).
#
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity - re-enable from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 2-18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        env:
          # Set a BACKEND_URL repository variable to override.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://stonks-backend-t9jb.onrender.com' }}
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 "$BACKEND_URL/" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
